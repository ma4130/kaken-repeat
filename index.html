<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まねっこコオロギ</title>
<style>
  :root {
    --sky1: #bfe9ff; --sky2: #eafbe0; --grass: #6cbf4a; --grass2: #4e9a35;
    --ink: #2d2a24; --card: #ffffffd9; --accent: #e8743b; --accent2: #c95a24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky1), var(--sky2) 60%, var(--grass) 60%, var(--grass2));
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
  }
  header { text-align: center; padding: 14px 16px 0; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); letter-spacing: .05em; }
  .sub { margin: 4px 0 0; font-size: 14px; opacity: .75; }

  .stage { position: relative; width: min(440px, 100vw - 32px); margin-top: 8px; }
  .bubble {
    position: relative; min-height: 64px; margin: 0 auto 6px; padding: 14px 18px;
    background: #fff; border-radius: 22px; box-shadow: 0 4px 0 #0001;
    font-size: clamp(18px, 4.5vw, 24px); text-align: center; word-break: break-all;
    transition: transform .15s;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%);
    border: 14px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.pop { transform: scale(1.06); }
  .bubble .hint { opacity: .45; font-size: .8em; }

  #bug { width: 100%; height: auto; display: block; }
  #bug .antenna { transform-box: fill-box; transform-origin: bottom center; animation: sway 2.4s ease-in-out infinite; }
  #bug .antenna.r { animation-delay: -1.2s; }
  #bug .body { transform-box: fill-box; transform-origin: bottom center; }
  #bug { transform-origin: 50% 95%; }
  #bug .wings, #bug .head, #bug .legs { transform-box: fill-box; transform-origin: center; }
  #bug .note { opacity: 0; transform-box: fill-box; transform-origin: center; }
  /* 話しているあいだの動き */
  #bug.talk { animation: hop .5s ease-in-out infinite; }
  #bug.talk .antenna { animation-duration: .3s; }
  #bug.talk .body { animation: bob .25s ease-in-out infinite; }
  #bug.talk .head { animation: nod .5s ease-in-out infinite; }
  #bug.talk .wings { animation: buzz .07s linear infinite alternate; }
  #bug.talk .legs { animation: tap .25s ease-in-out infinite alternate; }
  #bug.talk .note { animation: float 1.2s ease-out infinite; }
  #bug.talk .n2 { animation-delay: .4s; }
  #bug.talk .n3 { animation-delay: .8s; }
  @keyframes hop {
    0%,100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-12px) rotate(-3deg); }
    50% { transform: translateY(0) rotate(0); }
    75% { transform: translateY(-12px) rotate(3deg); }
  }
  @keyframes nod { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes buzz { from { transform: scale(1, 1) rotate(-1.5deg); } to { transform: scale(1.04, .97) rotate(1.5deg); } }
  @keyframes tap { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  @keyframes float {
    0% { opacity: 0; transform: translateY(10px) scale(.6); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-50px) scale(1.1) rotate(15deg); }
  }
  #bug.listen .ear { opacity: 1; }
  #bug .ear { opacity: 0; transition: opacity .2s; }
  #bug .eyelid { transform-box: fill-box; transform-origin: top center; transform: scaleY(0); animation: blink 4.5s infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes blink { 0%,94%,100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }

  .panel {
    width: min(440px, 100vw - 32px); margin: 10px 0 24px; padding: 14px;
    background: var(--card); border-radius: 18px; box-shadow: 0 6px 18px #0002;
    display: grid; gap: 12px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: #fff; padding: 10px 16px; box-shadow: 0 4px 0 var(--accent2);
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent2); }
  #micBtn { width: 100%; font-size: 20px; padding: 14px; }
  #micBtn.on { background: #3a9a55; box-shadow: 0 4px 0 #2a7340; }
  .meter { height: 10px; border-radius: 99px; background: #0001; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: linear-gradient(90deg, #7bd36b, #f2c94c, #e8743b); transition: width .06s; }
  .status { font-size: 14px; text-align: center; min-height: 1.4em; }
  label { font-size: 14px; white-space: nowrap; }
  input[type=range] { flex: 1; }
  .stats { display: flex; justify-content: space-between; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>まねっこコオロギ</h1>
  <p class="sub">話しかけると、コオロギのリリーが同じことを言い返すよ</p>
</header>

<div class="stage">
  <div class="bubble" id="bubble"><span class="hint">「マイクをオン」を押して話しかけてね</span></div>
  <svg id="bug" viewBox="0 0 400 330" aria-label="コオロギのリリー">
    <!-- 地面の影 -->
    <ellipse cx="200" cy="310" rx="130" ry="14" fill="#0002"/>
    <!-- 後ろ脚 -->
    <g class="legs" stroke="#5a3a1c" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M120 230 L60 170 L40 300"/>
      <path d="M280 230 L340 170 L360 300"/>
      <path d="M140 260 L100 300"/>
      <path d="M260 260 L300 300"/>
      <path d="M150 220 L95 250 L80 290"/>
      <path d="M250 220 L305 250 L320 290"/>
    </g>
    <g class="body">
      <!-- 触角 -->
      <path class="antenna l" d="M170 95 Q140 40 90 10" stroke="#4a2f16" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path class="antenna r" d="M230 95 Q260 40 310 10" stroke="#4a2f16" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 羽 -->
      <g class="wings">
        <ellipse cx="200" cy="215" rx="105" ry="80" fill="#7a4e22"/>
        <path d="M200 140 L200 290" stroke="#5a3a1c" stroke-width="4"/>
        <path d="M125 190 Q160 200 195 185 M128 225 Q165 235 195 222 M275 190 Q240 200 205 185 M272 225 Q235 235 205 222" stroke="#5a3a1c" stroke-width="3" fill="none"/>
      </g>
      <g class="head">
      <!-- 頭 -->
      <circle cx="200" cy="135" r="68" fill="#9a6630"/>
      <circle cx="200" cy="135" r="68" fill="url(#shine)"/>
      <!-- 目 -->
      <g>
        <circle cx="170" cy="122" r="20" fill="#fff"/>
        <circle cx="230" cy="122" r="20" fill="#fff"/>
        <circle id="pupilL" cx="173" cy="125" r="11" fill="#1d1a16"/>
        <circle id="pupilR" cx="233" cy="125" r="11" fill="#1d1a16"/>
        <circle cx="177" cy="120" r="4" fill="#fff"/>
        <circle cx="237" cy="120" r="4" fill="#fff"/>
        <rect class="eyelid" x="149" y="101" width="42" height="42" rx="21" fill="#9a6630"/>
        <rect class="eyelid" x="209" y="101" width="42" height="42" rx="21" fill="#9a6630"/>
      </g>
      <!-- ほっぺ -->
      <ellipse cx="150" cy="158" rx="12" ry="7" fill="#f39a8a" opacity=".7"/>
      <ellipse cx="250" cy="158" rx="12" ry="7" fill="#f39a8a" opacity=".7"/>
      <!-- 口 -->
      <ellipse id="mouth" cx="200" cy="168" rx="14" ry="3" fill="#5b1f14"/>
      </g>
      <!-- 聞いてるマーク -->
      <g class="ear" fill="#fff" stroke="#3a9a55" stroke-width="4">
        <path d="M290 110 q14 12 0 26" fill="none"/>
        <path d="M302 100 q24 22 0 46" fill="none"/>
      </g>
    </g>
    <!-- 話すときに出る音符 -->
    <g class="notes" fill="#e8743b" font-size="34" font-weight="bold">
      <text class="note n1" x="300" y="120">♪</text>
      <text class="note n2" x="80" y="150">♫</text>
      <text class="note n3" x="320" y="190">♪</text>
    </g>
    <defs>
      <radialGradient id="shine" cx=".35" cy=".3" r=".7">
        <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>
</div>

<div class="panel">
  <button id="micBtn">🎤 マイクをオン</button>
  <div class="meter"><div id="meter"></div></div>
  <div class="status" id="status">マイクを使うとき、ブラウザが許可を聞いてくるよ</div>

  <div class="row">
    <label for="pitch">声の高さ</label>
    <input type="range" id="pitch" min="1" max="2.4" step="0.05" value="1.6">
  </div>

  <div class="stats">
    <span>まねした回数: <b id="count">0</b></span>
    <span>リリーのレベル: <b id="level">1</b></span>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const bubble = $('bubble'), bug = $('bug'), mouth = $('mouth');
  const micBtn = $('micBtn'), meter = $('meter'), statusEl = $('status');
  const pitchEl = $('pitch'), countEl = $('count'), levelEl = $('level');

  let ctx = null, stream = null, proc = null, analyser = null;
  let micOn = false;
  // waiting: 声を待っている / recording: 録音中 / playing: まね中
  let state = 'off';
  let chunks = [], preroll = [], silence = 0, recLen = 0, noise = 0.01, cooldownUntil = 0;
  let count = 0;

  // ---------- 表示 ----------
  function say(text, hint) {
    bubble.innerHTML = '';
    const s = document.createElement('span');
    if (hint) s.className = 'hint';
    s.textContent = text;
    bubble.appendChild(s);
    bubble.classList.add('pop');
    setTimeout(() => bubble.classList.remove('pop'), 150);
  }
  function setStatus(t) { statusEl.textContent = t; }
  function setMouth(open) { mouth.setAttribute('ry', (3 + open * 22).toFixed(1)); mouth.setAttribute('rx', (14 + open * 6).toFixed(1)); }

  function addCount() {
    count++;
    countEl.textContent = count;
    levelEl.textContent = 1 + Math.floor(count / 5);
  }

  // 目が音のほうを見る
  function look(dx) {
    $('pupilL').setAttribute('cx', 173 + dx);
    $('pupilR').setAttribute('cx', 233 + dx);
  }

  // ---------- マイク ----------
  async function startMic() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (err) {
      setStatus('マイクが使えなかったよ。ブラウザのマイク許可を確認してね');
      return;
    }
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(2048, 1, 1);
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    proc.onaudioprocess = onAudio;

    micOn = true;
    state = 'waiting';
    micBtn.textContent = '🛑 マイクをオフ';
    micBtn.classList.add('on');
    bug.classList.add('listen');
    setStatus('聞いてるよ。何か話しかけてね');
    say('なになに？', true);
  }

  function stopMic() {
    micOn = false;
    state = 'off';
    if (proc) { proc.disconnect(); proc.onaudioprocess = null; proc = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    micBtn.textContent = '🎤 マイクをオン';
    micBtn.classList.remove('on');
    bug.classList.remove('listen');
    meter.style.width = '0';
    setStatus('マイクはオフだよ');
  }

  micBtn.onclick = () => micOn ? stopMic() : startMic();

  function onAudio(e) {
    const d = new Float32Array(e.inputBuffer.getChannelData(0));
    let sum = 0;
    for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
    const rms = Math.sqrt(sum / d.length);
    const dur = d.length / ctx.sampleRate;
    if (state !== 'playing') meter.style.width = Math.min(100, rms * 600) + '%';

    const start = Math.max(0.02, noise * 3.5);
    if (state === 'waiting') {
      if (ctx.currentTime < cooldownUntil) return;
      noise = noise * 0.97 + Math.min(rms, 0.05) * 0.03;
      preroll.push(d);
      if (preroll.length > Math.ceil(0.35 / dur)) preroll.shift();
      if (rms > start) {
        state = 'recording';
        chunks = preroll.slice(); preroll = [];
        recLen = 0; silence = 0;
        setStatus('ふむふむ…');
        look(-4);
      }
    } else if (state === 'recording') {
      chunks.push(d);
      recLen += dur;
      silence = rms < start * 0.7 ? silence + dur : 0;
      if (silence > 0.8 || recLen > 8) finishRecording();
    }
  }

  function finishRecording() {
    look(0);
    // 最後の無音を少し残してカット
    const dropChunks = Math.max(0, Math.floor((silence - 0.15) / (2048 / ctx.sampleRate)));
    const used = chunks.slice(0, chunks.length - dropChunks);
    const total = used.reduce((n, c) => n + c.length, 0);
    if (total / ctx.sampleRate < 0.3) { state = 'waiting'; setStatus('聞いてるよ。何か話しかけてね'); return; }
    const buf = ctx.createBuffer(1, total, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    let off = 0, peak = 0;
    for (const c of used) { ch.set(c, off); off += c.length; }
    for (let i = 0; i < total; i++) peak = Math.max(peak, Math.abs(ch[i]));
    const g = peak > 0 ? Math.min(4, 0.9 / peak) : 1;
    for (let i = 0; i < total; i++) ch[i] *= g;
    chunks = [];
    playBack(buf);
  }

  // ---------- まねして再生 ----------
  function chirp(t0) {
    // 「リリッ」という短い鳴き声
    for (let k = 0; k < 3; k++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 4200;
      const t = t0 + k * 0.06;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.12, t + 0.01);
      g.gain.linearRampToValueAtTime(0, t + 0.045);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.05);
    }
    return t0 + 0.25;
  }

  function playBack(buf) {
    state = 'playing';
    say('♪ リリ' + 'リ'.repeat(Math.min(6, Math.ceil(buf.duration * 2))) + '〜');
    setStatus('まねっこ中！');
    bug.classList.remove('listen');

    const rate = parseFloat(pitchEl.value);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate;
    // 虫っぽいビブラート
    const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
    lfo.frequency.value = 9; lfoGain.gain.value = 35;
    lfo.connect(lfoGain); lfoGain.connect(src.detune);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 250;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    src.connect(hp); hp.connect(analyser); analyser.connect(ctx.destination);

    const t0 = chirp(ctx.currentTime + 0.05);
    src.start(t0); lfo.start(t0);
    bug.classList.add('talk');
    animateMouth();
    src.onended = () => {
      lfo.stop();
      bug.classList.remove('talk');
      analyser = null;
      setMouth(0);
      addCount();
      if (micOn) {
        state = 'waiting';
        cooldownUntil = ctx.currentTime + 0.4;
        preroll = [];
        bug.classList.add('listen');
        setStatus('聞いてるよ。何か話しかけてね');
      } else state = 'off';
    };
  }

  function animateMouth() {
    if (!analyser) return;
    const a = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(a);
    let s = 0;
    for (const v of a) { const x = (v - 128) / 128; s += x * x; }
    setMouth(Math.min(1, Math.sqrt(s / a.length) * 4));
    meter.style.width = Math.min(100, Math.sqrt(s / a.length) * 400) + '%';
    requestAnimationFrame(animateMouth);
  }
})();
</script>
</body>
</html>
