<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まねっこムシ</title>
<style>
  :root {
    --sky1: #bfe9ff; --sky2: #eafbe0; --grass: #6cbf4a; --grass2: #4e9a35;
    --ink: #2d2a24; --card: #ffffffd9; --accent: #e8743b; --accent2: #c95a24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky1), var(--sky2) 60%, var(--grass) 60%, var(--grass2));
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
  }
  header { text-align: center; padding: 14px 16px 0; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); letter-spacing: .05em; }
  .sub { margin: 4px 0 0; font-size: 14px; opacity: .75; }

  .stage { position: relative; width: min(440px, 100vw - 32px); margin-top: 8px; }
  .bubble {
    position: relative; min-height: 64px; margin: 0 auto 6px; padding: 14px 18px;
    background: #fff; border-radius: 22px; box-shadow: 0 4px 0 #0001;
    font-size: clamp(18px, 4.5vw, 24px); text-align: center; word-break: break-all;
    transition: transform .15s;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%);
    border: 14px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.pop { transform: scale(1.06); }
  .bubble .hint { opacity: .45; font-size: .8em; }

  #bug { width: 100%; height: auto; display: block; transform-origin: 50% 95%; }
  #bug .antenna { transform-box: fill-box; transform-origin: bottom center; animation: sway 2.4s ease-in-out infinite; }
  #bug .antenna.r { animation-delay: -1.2s; }
  #bug .body { transform-box: fill-box; transform-origin: bottom center; }
  #bug .wings, #bug .head, #bug .legs { transform-box: fill-box; transform-origin: center; }
  #bug .note { opacity: 0; transform-box: fill-box; transform-origin: center; }
  #bug .ear { opacity: 0; transition: opacity .2s; }
  #bug.listen .ear { opacity: 1; }
  #bug .eyelid { transform-box: fill-box; transform-origin: top center; transform: scaleY(0); animation: blink 4.5s infinite; }
  /* 虫を切りかえたとき */
  #bug.enter { animation: enter .45s ease-out; }
  /* 話しているあいだの動き */
  #bug.talk { animation: hop .5s ease-in-out infinite; }
  #bug.talk .antenna { animation-duration: .3s; }
  #bug.talk .body { animation: bob .25s ease-in-out infinite; }
  #bug.talk .head { animation: nod .5s ease-in-out infinite; }
  #bug.talk .wings { animation: buzz .07s linear infinite alternate; }
  #bug.talk .legs { animation: tap .25s ease-in-out infinite alternate; }
  #bug.talk .note { animation: float 1.2s ease-out infinite; }
  #bug.talk .n2 { animation-delay: .4s; }
  #bug.talk .n3 { animation-delay: .8s; }
  @keyframes enter { 0% { transform: translateY(30px) scale(.7); opacity: 0; } 70% { transform: translateY(-8px) scale(1.04); opacity: 1; } 100% { transform: none; } }
  @keyframes hop {
    0%,100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-12px) rotate(-3deg); }
    50% { transform: translateY(0) rotate(0); }
    75% { transform: translateY(-12px) rotate(3deg); }
  }
  @keyframes nod { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes buzz { from { transform: scale(1, 1) rotate(-1.5deg); } to { transform: scale(1.04, .97) rotate(1.5deg); } }
  @keyframes tap { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  @keyframes float {
    0% { opacity: 0; transform: translateY(10px) scale(.6); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-50px) scale(1.1) rotate(15deg); }
  }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes blink { 0%,94%,100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }

  .picker {
    width: min(440px, 100vw - 32px); margin-top: 6px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .picker button {
    background: var(--card); color: var(--ink); box-shadow: 0 3px 0 #0002;
    border-radius: 14px; padding: 4px 2px 6px; font-size: 12px;
    border: 3px solid transparent; display: flex; flex-direction: column; align-items: center;
  }
  .picker button:active { box-shadow: 0 1px 0 #0002; }
  .picker button.sel { border-color: var(--accent); background: #fff; }
  .picker svg { width: 100%; max-width: 64px; height: auto; display: block; }

  .panel {
    width: min(440px, 100vw - 32px); margin: 10px 0 24px; padding: 14px;
    background: var(--card); border-radius: 18px; box-shadow: 0 6px 18px #0002;
    display: grid; gap: 12px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: #fff; padding: 10px 16px; box-shadow: 0 4px 0 var(--accent2);
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent2); }
  #micBtn { width: 100%; font-size: 20px; padding: 14px; }
  #micBtn.on { background: #3a9a55; box-shadow: 0 4px 0 #2a7340; }
  .meter { height: 10px; border-radius: 99px; background: #0001; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: linear-gradient(90deg, #7bd36b, #f2c94c, #e8743b); transition: width .06s; }
  .status { font-size: 14px; text-align: center; min-height: 1.4em; }
  label { font-size: 14px; white-space: nowrap; }
  input[type=range] { flex: 1; }
  .stats { display: flex; justify-content: space-between; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>まねっこムシ</h1>
  <p class="sub" id="sub">話しかけると、虫が同じことを言い返すよ</p>
</header>

<div class="stage">
  <div class="bubble" id="bubble"><span class="hint">「マイクをオン」を押して話しかけてね</span></div>
  <svg id="bug" viewBox="0 0 400 330"></svg>
</div>

<div class="picker" id="picker"></div>

<div class="panel">
  <button id="micBtn">🎤 マイクをオン</button>
  <div class="meter"><div id="meter"></div></div>
  <div class="status" id="status">マイクを使うとき、ブラウザが許可を聞いてくるよ</div>

  <div class="row">
    <label for="pitch">声の高さ</label>
    <input type="range" id="pitch" min="0.6" max="2.4" step="0.05" value="1.6">
  </div>

  <div class="stats">
    <span>まねした回数: <b id="count">0</b></span>
    <span><span id="lvName">リリー</span>のレベル: <b id="level">1</b></span>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ================= 虫のデータ =================
  // 顔（目・口）はどの虫も頭の中心 (200,135) に置く
  const face = (p, head) => `
    <g>
      <circle cx="170" cy="122" r="20" fill="#fff"/>
      <circle cx="230" cy="122" r="20" fill="#fff"/>
      <circle class="pupil" data-x="173" cx="173" cy="125" r="11" fill="#1d1a16"/>
      <circle class="pupil" data-x="233" cx="233" cy="125" r="11" fill="#1d1a16"/>
      <circle cx="177" cy="120" r="4" fill="#fff"/>
      <circle cx="237" cy="120" r="4" fill="#fff"/>
      <rect class="eyelid" x="149" y="101" width="42" height="42" rx="21" fill="${head}"/>
      <rect class="eyelid" x="209" y="101" width="42" height="42" rx="21" fill="${head}"/>
    </g>
    <ellipse cx="150" cy="158" rx="12" ry="7" fill="#f39a8a" opacity=".7"/>
    <ellipse cx="250" cy="158" rx="12" ry="7" fill="#f39a8a" opacity=".7"/>
    <ellipse class="mouth" cx="200" cy="168" rx="14" ry="3" fill="#5b1f14"/>`;

  const shine = p => `<radialGradient id="${p}shine" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;

  const antennaPair = (d, color, w, club) => ['l', 'r'].map(side => {
    const path = side === 'l' ? d : mirror(d);
    const tip = club ? (() => { const m = path.match(/(-?[\d.]+) (-?[\d.]+)\s*$/); return `<circle cx="${m[1]}" cy="${m[2]}" r="${club}" fill="${color}"/>`; })() : '';
    return `<g class="antenna ${side}"><path d="${path}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="round"/>${tip}</g>`;
  }).join('');
  // 左右対称にする（x → 400 - x）
  function mirror(d) {
    return d.replace(/(-?[\d.]+) (-?[\d.]+)/g, (_, x, y) => `${400 - parseFloat(x)} ${y}`);
  }
  const legsOf = (paths, color, w) =>
    `<g class="legs" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none">${
      paths.map(d => `<path d="${d}"/><path d="${mirror(d)}"/>`).join('')}</g>`;

  const BUGS = [
    {
      id: 'cricket', kind: 'コオロギ', name: 'リリー', head: '#9a6630', note: '#e8743b',
      voice: { rate: 1.6, vibHz: 9, vibDepth: 35, hp: 250 }, word: 'リリ', chirp: 'cricket',
      svg: p => `
        ${legsOf(['M120 230 L60 170 L40 300', 'M140 260 L100 300', 'M150 220 L95 250 L80 290'], '#5a3a1c', 10)}
        <g class="body">
          ${antennaPair('M170 95 Q140 40 90 10', '#4a2f16', 5)}
          <g class="wings">
            <ellipse cx="200" cy="215" rx="105" ry="80" fill="#7a4e22"/>
            <path d="M200 140 L200 290" stroke="#5a3a1c" stroke-width="4"/>
            <path d="M125 190 Q160 200 195 185 M128 225 Q165 235 195 222 M275 190 Q240 200 205 185 M272 225 Q235 235 205 222" stroke="#5a3a1c" stroke-width="3" fill="none"/>
          </g>
          <g class="head">
            <circle cx="200" cy="135" r="68" fill="#9a6630"/>
            <circle cx="200" cy="135" r="68" fill="url(#${p}shine)"/>
            ${face(p, '#9a6630')}
          </g>
        </g>`
    },
    {
      id: 'ladybug', kind: 'テントウムシ', name: 'テンコ', head: '#2a2522', note: '#e23b2e',
      voice: { rate: 1.85, vibHz: 6, vibDepth: 20, hp: 300 }, word: 'ポポ', chirp: 'ladybug',
      svg: p => `
        ${legsOf(['M125 250 L90 290', 'M118 210 L75 235', 'M145 280 L125 305'], '#1d1a16', 8)}
        <g class="body">
          ${antennaPair('M178 85 Q168 60 150 48', '#1d1a16', 5, 7)}
          <g class="wings">
            <ellipse cx="200" cy="215" rx="115" ry="88" fill="#e23b2e"/>
            <ellipse cx="200" cy="215" rx="115" ry="88" fill="url(#${p}shine)"/>
            <path d="M200 135 L200 302" stroke="#1d1a16" stroke-width="5"/>
            <g fill="#1d1a16">
              <circle cx="145" cy="195" r="15"/><circle cx="255" cy="195" r="15"/>
              <circle cx="135" cy="245" r="12"/><circle cx="265" cy="245" r="12"/>
              <circle cx="178" cy="272" r="11"/><circle cx="222" cy="272" r="11"/>
            </g>
          </g>
          <g class="head">
            <circle cx="200" cy="135" r="62" fill="#2a2522"/>
            <circle cx="200" cy="135" r="62" fill="url(#${p}shine)"/>
            <circle cx="160" cy="95" r="10" fill="#fff" opacity=".9"/><circle cx="240" cy="95" r="10" fill="#fff" opacity=".9"/>
            ${face(p, '#2a2522')}
          </g>
        </g>`
    },
    {
      id: 'bee', kind: 'ミツバチ', name: 'ブンタ', head: '#f2c230', note: '#d99a00',
      voice: { rate: 1.45, vibHz: 28, vibDepth: 70, hp: 220 }, word: 'ブン', chirp: 'bee',
      svg: p => `
        ${legsOf(['M130 255 L100 295', 'M120 215 L82 240 L78 262', 'M150 280 L135 305'], '#2a2118', 6)}
        <g class="body">
          ${antennaPair('M180 82 L165 45 L140 32', '#2a2118', 5, 6)}
          <g class="wings">
            <ellipse cx="110" cy="150" rx="72" ry="42" transform="rotate(-28 110 150)" fill="#e4f5ff" opacity=".85" stroke="#9cc4d8" stroke-width="3"/>
            <ellipse cx="290" cy="150" rx="72" ry="42" transform="rotate(28 290 150)" fill="#e4f5ff" opacity=".85" stroke="#9cc4d8" stroke-width="3"/>
          </g>
          <clipPath id="${p}belly"><ellipse cx="200" cy="222" rx="95" ry="78"/></clipPath>
          <g clip-path="url(#${p}belly)">
            <rect x="100" y="140" width="200" height="170" fill="#f5c518"/>
            <rect x="100" y="200" width="200" height="22" fill="#2a2118"/>
            <rect x="100" y="245" width="200" height="22" fill="#2a2118"/>
            <rect x="100" y="288" width="200" height="22" fill="#2a2118"/>
            <ellipse cx="200" cy="222" rx="95" ry="78" fill="url(#${p}shine)"/>
          </g>
          <g class="head">
            <circle cx="200" cy="135" r="64" fill="#f2c230"/>
            <circle cx="200" cy="135" r="64" fill="url(#${p}shine)"/>
            ${face(p, '#f2c230')}
          </g>
        </g>`
    },
    {
      id: 'beetle', kind: 'カブトムシ', name: 'カブキチ', head: '#5a2e12', note: '#8a4a1c',
      voice: { rate: 0.78, vibHz: 4, vibDepth: 15, hp: 80 }, word: 'ムン', chirp: 'beetle',
      svg: p => `
        ${legsOf(['M120 230 L62 205 L45 292', 'M140 262 L98 300', 'M150 215 L92 232 L70 280'], '#2b1709', 10)}
        <g class="body">
          ${antennaPair('M172 92 L148 76', '#2b1709', 4)}
          <g class="wings">
            <ellipse cx="200" cy="218" rx="110" ry="88" fill="#6b3514"/>
            <ellipse cx="200" cy="218" rx="110" ry="88" fill="url(#${p}shine)"/>
            <path d="M200 140 L200 305" stroke="#3a1c08" stroke-width="4"/>
            <ellipse cx="155" cy="190" rx="22" ry="40" fill="#fff" opacity=".12" transform="rotate(20 155 190)"/>
          </g>
          <g class="head">
            <path d="M186 90 C176 50 182 22 200 4 C218 22 224 50 214 90 Z" fill="#3a1d0a"/>
            <path d="M200 10 L186 0 M200 10 L214 0" stroke="#3a1d0a" stroke-width="8" stroke-linecap="round"/>
            <circle cx="200" cy="135" r="64" fill="#5a2e12"/>
            <circle cx="200" cy="135" r="64" fill="url(#${p}shine)"/>
            ${face(p, '#5a2e12')}
          </g>
        </g>`
    },
    {
      id: 'cicada', kind: 'セミ', name: 'ミンミン', head: '#5b7a3f', note: '#3f8a5a',
      voice: { rate: 1.3, vibHz: 14, vibDepth: 80, hp: 400 }, word: 'ミン', chirp: 'cicada',
      svg: p => `
        ${legsOf(['M140 250 L105 285', 'M135 215 L95 230', 'M155 280 L140 305'], '#4a3a22', 6)}
        <g class="body">
          ${antennaPair('M180 82 L162 68', '#3a2e1a', 4)}
          <g class="wings" fill="#eaf7ff" fill-opacity=".75" stroke="#6f8f5c" stroke-width="3">
            <path d="M190 150 C120 118 38 168 58 285 C110 298 170 252 195 200 Z"/>
            <path d="M210 150 C280 118 362 168 342 285 C290 298 230 252 205 200 Z"/>
            <path d="M185 165 C140 170 95 210 70 270 M180 185 C150 210 120 250 100 288 M215 165 C260 170 305 210 330 270 M220 185 C250 210 280 250 300 288" fill="none" stroke-width="2"/>
          </g>
          <ellipse cx="200" cy="225" rx="62" ry="78" fill="#6b5636"/>
          <path d="M150 230 Q200 245 250 230 M155 258 Q200 272 245 258 M168 284 Q200 294 232 284" stroke="#4a3a22" stroke-width="4" fill="none"/>
          <g class="head">
            <ellipse cx="200" cy="135" rx="74" ry="62" fill="#5b7a3f"/>
            <ellipse cx="200" cy="135" rx="74" ry="62" fill="url(#${p}shine)"/>
            <circle cx="200" cy="88" r="6" fill="#e05a3a"/>
            ${face(p, '#5b7a3f')}
          </g>
        </g>`
    },
  ];

  // 1匹ぶんの SVG（中身）を作る。p はID がかぶらないようにする接頭辞
  function bugMarkup(b, p, withExtras) {
    return `
      <defs>${shine(p)}</defs>
      <ellipse cx="200" cy="312" rx="130" ry="14" fill="#0002"/>
      ${b.svg(p)}
      ${withExtras ? `
      <g class="ear" stroke="#3a9a55" stroke-width="4" fill="none">
        <path d="M296 110 q14 12 0 26"/><path d="M308 100 q24 22 0 46"/>
      </g>
      <g class="notes" fill="${b.note}" font-size="34" font-weight="bold">
        <text class="note n1" x="300" y="120">♪</text>
        <text class="note n2" x="80" y="150">♫</text>
        <text class="note n3" x="320" y="190">♪</text>
      </g>` : ''}`;
  }

  // ================= 画面 =================
  const bubble = $('bubble'), bug = $('bug');
  const micBtn = $('micBtn'), meter = $('meter'), statusEl = $('status');
  const pitchEl = $('pitch'), countEl = $('count'), levelEl = $('level');
  let cur = BUGS[0];
  let mouth = null;

  // 虫えらびのボタン
  const picker = $('picker');
  BUGS.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.id = b.id;
    btn.setAttribute('aria-label', b.kind);
    btn.innerHTML = `<svg viewBox="0 -10 400 340">${bugMarkup(b, 'pk' + i + '-', false)}</svg><span>${b.kind}</span>`;
    btn.onclick = () => selectBug(b.id, true);
    picker.appendChild(btn);
  });

  function selectBug(id, byUser) {
    cur = BUGS.find(b => b.id === id) || BUGS[0];
    const talking = bug.classList.contains('talk');
    bug.innerHTML = bugMarkup(cur, 'main-', true);
    bug.setAttribute('aria-label', `${cur.kind}の${cur.name}`);
    mouth = bug.querySelector('.mouth');
    bug.classList.toggle('listen', micOn && state !== 'playing');
    for (const btn of picker.children) btn.classList.toggle('sel', btn.dataset.id === cur.id);
    $('sub').textContent = `話しかけると、${cur.kind}の${cur.name}が同じことを言い返すよ`;
    $('lvName').textContent = cur.name;
    pitchEl.value = cur.voice.rate;
    try { localStorage.setItem('manekko_bug', cur.id); } catch (_) {}
    if (byUser) {
      if (!talking) {
        bug.classList.remove('enter'); void bug.getBoundingClientRect(); bug.classList.add('enter');
        say(`${cur.name}だよ！`, false);
      }
      const c = getCtx();
      if (c && state !== 'playing') chirp(c.currentTime + 0.02);
    }
  }
  bug.addEventListener('animationend', e => { if (e.animationName === 'enter') bug.classList.remove('enter'); });

  function say(text, hint) {
    bubble.innerHTML = '';
    const s = document.createElement('span');
    if (hint) s.className = 'hint';
    s.textContent = text;
    bubble.appendChild(s);
    bubble.classList.add('pop');
    setTimeout(() => bubble.classList.remove('pop'), 150);
  }
  function setStatus(t) { statusEl.textContent = t; }
  function setMouth(open) {
    if (!mouth) return;
    mouth.setAttribute('ry', (3 + open * 22).toFixed(1));
    mouth.setAttribute('rx', (14 + open * 6).toFixed(1));
  }
  // 目が音のほうを見る
  function look(dx) {
    bug.querySelectorAll('.pupil').forEach(el => el.setAttribute('cx', +el.dataset.x + dx));
  }

  let count = 0;
  function addCount() {
    count++;
    countEl.textContent = count;
    levelEl.textContent = 1 + Math.floor(count / 5);
  }

  // ================= 音 =================
  let ctx = null, stream = null, proc = null, analyser = null;
  let micOn = false;
  // off / waiting: 声を待っている / recording: 録音中 / playing: まね中
  let state = 'off';
  let chunks = [], preroll = [], silence = 0, recLen = 0, noise = 0.01, cooldownUntil = 0;

  function getCtx() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (_) { return null; }
  }

  // 短い音を1つ鳴らす
  function tone(t, o) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(o.vol, t + Math.min(0.02, o.dur / 4));
    g.gain.linearRampToValueAtTime(0, t + o.dur);
    let last = osc;
    if (o.filter) {
      const f = ctx.createBiquadFilter();
      f.type = o.filter; f.frequency.value = o.ff; f.Q.value = o.q || 1;
      osc.connect(f); last = f;
    }
    if (o.am) {
      // 「ミーン」のふるえ
      const am = ctx.createGain(), lfo = ctx.createOscillator(), depth = ctx.createGain();
      am.gain.value = 0.5; lfo.frequency.value = o.am; depth.gain.value = 0.5;
      lfo.connect(depth); depth.connect(am.gain);
      last.connect(am); last = am;
      lfo.start(t); lfo.stop(t + o.dur + 0.02);
    }
    last.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + o.dur + 0.02);
  }

  // 虫ごとの鳴き声。鳴き終わる時刻を返す
  function chirp(t0) {
    switch (cur.chirp) {
      case 'cricket': // リリッ
        for (let k = 0; k < 3; k++) tone(t0 + k * 0.06, { f0: 4200, dur: 0.045, vol: 0.12 });
        return t0 + 0.25;
      case 'ladybug': // ポポッ
        tone(t0, { f0: 500, f1: 1100, dur: 0.08, vol: 0.25 });
        tone(t0 + 0.11, { f0: 650, f1: 1400, dur: 0.08, vol: 0.25 });
        return t0 + 0.28;
      case 'bee': // ブーン
        tone(t0, { type: 'sawtooth', f0: 190, f1: 230, dur: 0.35, vol: 0.18, filter: 'lowpass', ff: 1400 });
        return t0 + 0.4;
      case 'beetle': // ドスン
        tone(t0, { f0: 130, f1: 55, dur: 0.22, vol: 0.45 });
        return t0 + 0.3;
      case 'cicada': // ミーン
        tone(t0, { type: 'sawtooth', f0: 3000, f1: 3300, dur: 0.38, vol: 0.12, filter: 'bandpass', ff: 3200, q: 4, am: 35 });
        return t0 + 0.45;
    }
    return t0;
  }

  // ---------- マイク ----------
  async function startMic() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (err) {
      setStatus('マイクが使えなかったよ。ブラウザのマイク許可を確認してね');
      return;
    }
    getCtx();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(2048, 1, 1);
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    proc.onaudioprocess = onAudio;

    micOn = true;
    state = 'waiting';
    micBtn.textContent = '🛑 マイクをオフ';
    micBtn.classList.add('on');
    bug.classList.add('listen');
    setStatus('聞いてるよ。何か話しかけてね');
    say('なになに？', true);
  }

  function stopMic() {
    micOn = false;
    if (state !== 'playing') state = 'off';
    if (proc) { proc.disconnect(); proc.onaudioprocess = null; proc = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    micBtn.textContent = '🎤 マイクをオン';
    micBtn.classList.remove('on');
    bug.classList.remove('listen');
    meter.style.width = '0';
    setStatus('マイクはオフだよ');
  }

  micBtn.onclick = () => micOn ? stopMic() : startMic();

  function onAudio(e) {
    const d = new Float32Array(e.inputBuffer.getChannelData(0));
    let sum = 0;
    for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
    const rms = Math.sqrt(sum / d.length);
    const dur = d.length / ctx.sampleRate;
    if (state !== 'playing') meter.style.width = Math.min(100, rms * 600) + '%';

    const start = Math.max(0.02, noise * 3.5);
    if (state === 'waiting') {
      if (ctx.currentTime < cooldownUntil) return;
      noise = noise * 0.97 + Math.min(rms, 0.05) * 0.03;
      preroll.push(d);
      if (preroll.length > Math.ceil(0.35 / dur)) preroll.shift();
      if (rms > start) {
        state = 'recording';
        chunks = preroll.slice(); preroll = [];
        recLen = 0; silence = 0;
        setStatus('ふむふむ…');
        look(-4);
      }
    } else if (state === 'recording') {
      chunks.push(d);
      recLen += dur;
      silence = rms < start * 0.7 ? silence + dur : 0;
      if (silence > 0.8 || recLen > 8) finishRecording();
    }
  }

  function finishRecording() {
    look(0);
    // 最後の無音を少し残してカット
    const dropChunks = Math.max(0, Math.floor((silence - 0.15) / (2048 / ctx.sampleRate)));
    const used = chunks.slice(0, chunks.length - dropChunks);
    const total = used.reduce((n, c) => n + c.length, 0);
    if (total / ctx.sampleRate < 0.3) { state = 'waiting'; setStatus('聞いてるよ。何か話しかけてね'); return; }
    const buf = ctx.createBuffer(1, total, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    let off = 0, peak = 0;
    for (const c of used) { ch.set(c, off); off += c.length; }
    for (let i = 0; i < total; i++) peak = Math.max(peak, Math.abs(ch[i]));
    const g = peak > 0 ? Math.min(4, 0.9 / peak) : 1;
    for (let i = 0; i < total; i++) ch[i] *= g;
    chunks = [];
    playBack(buf);
  }

  // ---------- まねして再生 ----------
  function playBack(buf) {
    state = 'playing';
    const v = cur.voice;
    const n = Math.min(4, Math.ceil(buf.duration * 1.5));
    say('♪ ' + cur.word.repeat(n) + '〜');
    setStatus(`${cur.name}がまねっこ中！`);
    bug.classList.remove('listen');

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = parseFloat(pitchEl.value);
    // 虫っぽいビブラート
    const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
    lfo.frequency.value = v.vibHz; lfoGain.gain.value = v.vibDepth;
    lfo.connect(lfoGain); lfoGain.connect(src.detune);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = v.hp;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    src.connect(hp); hp.connect(analyser); analyser.connect(ctx.destination);

    const t0 = chirp(ctx.currentTime + 0.05);
    src.start(t0); lfo.start(t0);
    bug.classList.remove('enter');
    bug.classList.add('talk');
    animateMouth();
    src.onended = () => {
      lfo.stop();
      bug.classList.remove('talk');
      analyser = null;
      setMouth(0);
      addCount();
      if (micOn) {
        state = 'waiting';
        cooldownUntil = ctx.currentTime + 0.4;
        preroll = [];
        bug.classList.add('listen');
        setStatus('聞いてるよ。何か話しかけてね');
      } else state = 'off';
    };
  }

  function animateMouth() {
    if (!analyser) return;
    const a = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(a);
    let s = 0;
    for (const v of a) { const x = (v - 128) / 128; s += x * x; }
    setMouth(Math.min(1, Math.sqrt(s / a.length) * 4));
    meter.style.width = Math.min(100, Math.sqrt(s / a.length) * 400) + '%';
    requestAnimationFrame(animateMouth);
  }

  // 最初の虫（前回えらんだ虫）
  let saved = null;
  try { saved = localStorage.getItem('manekko_bug'); } catch (_) {}
  selectBug(saved || BUGS[0].id, false);
})();
</script>
